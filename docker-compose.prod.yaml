services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.uv
    working_dir: /flask_app
    command: ["uv", "run", "gunicorn", "--chdir", "/flask_app", "--pythonpath", "/flask_app", "-w", "4", "--max-requests", "100", "--timeout", "20", "--bind", "0.0.0.0:5001", "blog:app"]
    expose:
      - 5001
    env_file:
      - ./.env
    init: true
    volumes:
      - /home/ubuntu/flask_site/static/assets/data/structures:/flask_app/static/assets/data/structures
      - /home/ubuntu/flask_site/static/assets/img/dps:/flask_app/static/assets/img/dps
      - type: bind
        source: ./logs/
        target: /flask_site/logs
  nginx:
    build: ./services/nginx
    volumes:
      - ./services/certbot/conf:/etc/letsencrypt
      - ./services/certbot/www:/var/www/certbot
    ports:
      - 80:80
      - 443:443
    init: true
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - web
  certbot:
    image: certbot/certbot
    volumes:
      - ./services/certbot/conf:/etc/letsencrypt
      - ./services/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

